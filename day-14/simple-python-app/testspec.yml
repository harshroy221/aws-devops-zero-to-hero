version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11

  pre_build:
    commands:
      - pip install -r day-14/simple-python-app/requirements.txt
      - pip install pytest

  build:
    commands:
      - cd day-14/simple-python-app
      - echo "Running tests"
      - python -m pytest -v

  post_build:
    commands:
      - if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then echo "Tests passed"; else echo "Tests failed"; exit 1; fi
